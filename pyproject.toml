[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "river-sentinel-ml"
version = "0.1.0"
description = "飞云江水位预测与防汛辅助决策智能体的数据和算法基础包"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
modeling = ["xgboost>=2,<4", "torch>=2.4,<3"]
# DS-8A 后端与智能体可选依赖：安装命令 `pip install -e ".[backend,dev]"`。
backend = [
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
river-sentinel-data = "river_sentinel_ml.cli:main"

[tool.setuptools]
package-dir = {"" = "ml/src"}

[tool.setuptools.packages.find]
where = ["ml/src"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
addopts = "-q"
# 让 `backend` 与 `ml` 包可以从仓库根目录直接导入（`python -m pytest` 不额外设置 PYTHONPATH）。
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# 显式固定 lint 规则集：避免 ruff 版本升级后默认规则集变化，
# 导致同一份代码在不同环境下得出不同结论。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Task 3 的两个前置测试是契约冻结文件（受 SHA-256 约束，内容不得改动），
# 它们不满足当前 formatter 的行宽风格，故仅对格式化排除这两个文件；
# lint 仍然覆盖它们（在收敛后的规则集下无告警）。
[tool.ruff.format]
exclude = [
  "ml/tests/ingestion/test_files.py",
  "ml/tests/ingestion/test_wenzhou_api.py",
]
